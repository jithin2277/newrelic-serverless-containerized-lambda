service: newrelic-serverless-lambda
frameworkVersion: "~4.35.1"
useDotenv: true

plugins:
  - serverless-offline

package:
  individually: false
  excludeDevDependencies: true
  patterns:
    - "!node_modules/@aws-sdk/**" 

provider:
  name: aws
  region: ap-southeast-2
  timeout: 10
  architecture: x86_64
  ecr:
    scanOnPush: true
    images:
      appimage:
        path: ./
        file: Dockerfile
        platform: linux/amd64

  environment:
    STAGE: ${sls:stage}
    LOG_LEVEL: ${env:LOG_LEVEL, "INFO"}

    # New Relic environment variables
    NEW_RELIC_ACCOUNT_ID: ${env:NEW_RELIC_ACCOUNT_ID, "0"}
    NEW_RELIC_APP_NAME: newrelic-serverless-lambda-${sls:stage}
    NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: true
    NEW_RELIC_EXTENSION_LOGS_ENABLED: true
    NEW_RELIC_EXTENSION_LOG_LEVEL: ${env:LOG_LEVEL, "INFO"}
    NEW_RELIC_EXTENSION_SEND_FUNCTION_LOGS: true
    NEW_RELIC_EXTENSION_SEND_PLATFORM_LOGS: true
    NEW_RELIC_LAMBDA_HANDLER: dist/handler.handler
    NEW_RELIC_LICENSE_KEY: ${env:NEW_RELIC_LICENSE_KEY, "placeholder"}

custom:
  serverless-offline:
    httpPort: 4000
    host: localhost

functions:
  hello-world:
    image:
      name: appimage
      command:
        - dist/handler.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: hello
          method: get
