org: dcsnsw
service: api
frameworkVersion: "~4.35.1"
useDotenv: true

package:
  individually: false
  excludeDevDependencies: true
  patterns:
    - "!node_modules/@aws-sdk/**" # Included via Node 22.x Lambda runtime/

build:
  esbuild: false

plugins:
  - ./serverless/offline-image-manager
  - serverless-webpack
  - serverless-domain-manager
  - serverless-offline
  - serverless-offline-sns
  - serverless-offline-scheduler
  - serverless-plugin-split-stacks

custom:
  # For PR preview environments, parentStage resolves to 'preview' so shared
  # infrastructure (VPC, secrets, SNS/SQS) references the PREVIEW stack.
  # For normal deploys this defaults to the current stage.
  parentStage: ${param:parentStage, '${sls:stage}'}

  # Allows overriding the DeletionPolicy on the Lambda execution role via
  # --param=lambdaIamRoleDeletionPolicy=Retain. Defaults to Delete.
  lambdaIamRoleDeletionPolicy: ${param:lambdaIamRoleDeletionPolicy, 'Delete'}

  hpnewrelicsecrets: ${ssm:/aws/reference/secretsmanager/hp-newrelic-secrets, null}
  hphwintegrationsecret: ${ssm:/aws/reference/secretsmanager/hp-hw-integration-secrets-${self:custom.parentStage}, null}
  authtokensecrets: ${ssm:/aws/reference/secretsmanager/hp-auth-token-secrets-${self:custom.parentStage}, null}
  hmacsecrets: ${ssm:/aws/reference/secretsmanager/hp-cloud-hmac-key-${self:custom.parentStage}, null}
  rdsproxyappsecret: ${ssm:/aws/reference/secretsmanager/hp-rds-proxy-app-secret-${self:custom.parentStage}, null}
  # Fallback stage config for PR preview environments and other unknown stages.
  # PR environments use the shared PREVIEW custom domain with a per-PR base path.
  default:
    domainNameV: "api-preview.hazardpublisher.nsw.gov.au"
    ssl_cert: "*.hazardpublisher.nsw.gov.au"
    corsOrigin: "https://preview.hazardpublisher.nsw.gov.au"
  preview:
    domainNameV: "api-preview.hazardpublisher.nsw.gov.au"
    ssl_cert: "*.hazardpublisher.nsw.gov.au"
    corsOrigin: "https://preview.hazardpublisher.nsw.gov.au"
  dev:
    domainNameV: "api-dev.hazardpublisher.nsw.gov.au"
    ssl_cert: "*.hazardpublisher.nsw.gov.au"
    corsOrigin: "https://dev.hazardpublisher.nsw.gov.au"
  test:
    domainNameV: "api-test.hazardpublisher.nsw.gov.au"
    ssl_cert: "*.hazardpublisher.nsw.gov.au"
    corsOrigin: "https://test.hazardpublisher.nsw.gov.au"
  staging:
    domainNameV: "api-staging.hazardpublisher.nsw.gov.au"
    ssl_cert: "*.hazardpublisher.nsw.gov.au"
    corsOrigin: "https://staging.hazardpublisher.nsw.gov.au"
  training:
    domainNameV: "api-training.hazardpublisher.nsw.gov.au"
    ssl_cert: "*.hazardpublisher.nsw.gov.au"
    corsOrigin: "https://training.hazardpublisher.nsw.gov.au"
  prod:
    domainNameV: "api.hazardpublisher.nsw.gov.au"
    ssl_cert: "hazardpublisher.nsw.gov.au"
    corsOrigin: "https://hazardpublisher.nsw.gov.au"
  local:
    domainNameV: "localhost"
    ssl_cert: "localhost"
    corsOrigin: "http://localhost:3000"
  # Automatic version pruning to prevent blowing AWS lambda storage limit.
  prune:
    automatic: true
    number: 3

  splitStacks:
    custom: slsSplitter.js

  webpack:
    webpackConfig: "webpack.config.js"
    packager: "yarn"
    # Composite install uses a minimal package.json + root yarn.lock;
    # --frozen-lockfile often fails for Yarn workspaces (it is still enforced in the monorepo root install, just not this composite install).
    packagerOptions:
      noFrozenLockfile: true
    excludeFiles:
      - src/**/*.spec.ts
      - src/**/__helpers__/*.ts
    includeModules:
      nodeModulesRelativeDir: "../../"
      forceExclude:
        - "@aws-sdk/client-scheduler"
        - "@aws-sdk/client-dynamodb"
        - "@aws-sdk/client-eventbridge"
        - "@aws-sdk/client-s3"
        - "@aws-sdk/client-sns"
        - "@aws-sdk/client-lambda"
        - "@aws-sdk/client-secrets-manager"
        - "@aws-sdk/client-sesv2"
        - "@aws-sdk/s3-request-presigner"
        - "@aws-sdk/lib-dynamodb"

  serverless-offline:
    httpPort: 4000
    host: 0.0.0.0

  serverless-offline-sns:
    debug: serverless-offline-sns:*
    port: 4002

  customDomain:
    domainName: ${self:custom.${sls:stage}.domainNameV, self:custom.default.domainNameV}
    basePath: ${param:apiBasePath, 'v1'}
    stage: ${sls:stage}
    certificateName: ${self:custom.${sls:stage}.ssl_cert, self:custom.default.ssl_cert}
    endpointType: edge
    createRoute53Record: false
    # Automatically create/delete the API Gateway custom domain on deploy/remove.
    # PR teardowns pass autoDomain=false so the shared preview domain is preserved
    # while still cleaning up the PR's base path mapping.
    autoDomain: ${strToBool(${param:autoDomain, 'true'})}
    # Prevent `serverless remove` from deleting the shared API custom domain
    # when tearing down a PR stack that only owns one base path mapping.
    preserveExternalPathMappings: true
    enabled: ${strToBool(${param:enableCustomDomain, 'true'})}

  # Provisioned resource configuration.
  resources:
    AUTH_TOKEN_SECRET: ${self:custom.authtokensecrets.AUTH_TOKEN_SECRET, 'PLACEHOLDER_VALUE'}
    REFRESH_TOKEN_SECRET: ${self:custom.authtokensecrets.REFRESH_TOKEN_SECRET, 'PLACEHOLDER_VALUE'}
    HW_API_KEY: ${self:custom.hphwintegrationsecret.HW_API_KEY, 'PLACEHOLDER_VALUE'}
    HW_API_BASE_URL: ${self:custom.hphwintegrationsecret.HW_API_BASE_URL, 'PLACEHOLDER_VALUE'}
    HW_APP_BASE_URL: ${self:custom.hphwintegrationsecret.HW_APP_BASE_URL, 'PLACEHOLDER_VALUE'}
    HP_CAP_AU_BUCKET: ${self:custom.hphwintegrationsecret.HP_CAP_AU_BUCKET, 'PLACEHOLDER_VALUE'}
    BASE_DATABASE_URL: ${self:custom.rdsproxyappsecret.BASE_DATABASE_URL, 'PLACEHOLDER_VALUE'}

  # GIS configuration.
  # Reset the GIS token at 10:00AM every Wednesday AEST/ADST (expressed in UTC because lambdas run on UTC). The token expires
  # every 2 weeks but we can still request a new one before that. Using the cron syntax rather than the rate syntax means we
  # know exactly when the token will be reset even across releases.
  resetGISTokenRate:
    default: "cron(0 23 ? * TUE *)"
    local: "cron(0 23 ? * * *)"
    preview: "cron(0 23 ? * * *)"
    dev: "cron(0 23 ? * * *)"
    test: "cron(0 23 ? * * *)"
    staging: "cron(0 23 ? * TUE *)"
    training: "cron(0 23 ? * TUE *)"
    prod: "cron(0 23 ? * TUE *)"

  # Report disabled DL items every day at 10:00AM AEST/ADST (expressed in UTC because lambdas run on UTC).
  notifyEmailBouncesRate:
    default: "cron(0 23 ? * FRI *)"
    local: "cron(0 23 ? * * *)"
    preview: "cron(0 23 ? * * *)"
    dev: "cron(0 23 ? * * *)"
    test: "cron(0 23 ? * FRI *)"
    staging: "cron(0 23 ? * FRI *)"
    training: "cron(0 23 ? * FRI *)"
    prod: "cron(0 23 ? * FRI *)"

  # Verify social media profile authorization states every day (expressed in UTC because lambdas run on UTC).
  # Staggering the schedule of the cron job, so that not all environments run at the same time.
  verifySocialMediaProfileAuthStatesRate:
    default: "cron(50 22 ? * * *)" # 22:50
    local: "cron(50 22 ? * * *)" # 22:50
    dev: "cron(05 23 ? * * *)" # 23:05
    preview: "cron(20 23 ? * * *)" # 23:20
    test: "cron(35 23 ? * * *)" # 23:35
    staging: "cron(50 23 ? * * *)" # 23:50
    training: "cron(05 00 ? * * *)" # 00:05
    prod: "cron(50 22 ? * * *)" # 22:50

  # Send an email every hour to the social media team indicating new, fresh disconnected fb/twitter profiles that need attention.
  emailNewSocialMediaProfileDisconnectionsRate:
    default: "cron(0 * ? * * *)"
    local: "cron(0 * ? * * *)"
    preview: "cron(0 * ? * * *)"
    dev: "cron(0 * ? * * *)"
    test: "cron(0 * ? * * *)"
    staging: "cron(0 * ? * * *)"
    training: "cron(0 * ? * * *)"
    prod: "cron(0 * ? * * *)"

  # Send an email once a day to the social media team indicating the disconnected fb/twitter profiles that need attention.
  emailAllSocialMediaProfileDisconnectionsRate:
    default: "cron(50 20 ? * * *)"
    local: "cron(50 20 ? * * *)"
    preview: "cron(50 20 ? * * *)"
    dev: "cron(50 20 ? * * *)"
    test: "cron(50 20 ? * * *)"
    staging: "cron(50 20 ? * * *)"
    training: "cron(50 20 ? * * *)"
    prod: "cron(50 20 ? * * *)"

  # Process abandoned publish social media warnings every 15 minutes
  emailAbandonedPublishSocialMediaWarningsRate:
    default: "cron(*/15 * ? * * *)"
    local: "cron(*/15 * ? * * *)"
    preview: "cron(*/15 * ? * * *)"
    dev: "cron(*/15 * ? * * *)"
    test: "cron(*/15 * ? * * *)"
    staging: "cron(*/15 * ? * * *)"
    training: "cron(*/15 * ? * * *)"
    prod: "cron(*/15 * ? * * *)"

  # Process "Warning Update Required" emails every 5 minutes
  notifyWarningUpdateRequiredRate:
    default: "cron(*/5 * ? * * *)"
    local: "cron(*/5 * ? * * *)"
    preview: "cron(*/5 * ? * * *)"
    dev: "cron(*/5 * ? * * *)"
    test: "cron(*/5 * ? * * *)"
    staging: "cron(*/5 * ? * * *)"
    training: "cron(*/5 * ? * * *)"
    prod: "cron(*/5 * ? * * *)"

  #  etlReportingDataRate:
  #    default: "cron(- - - - - -)"
  #    local: "cron(- - - - - -)"
  #    preview: "cron(- - - - - -)"
  #    dev: "cron(- - - - - -)"
  #    test: "cron(- - - - - -)"
  #    staging: "cron(- - - - - -)"
  #    # Turning off cron schedule as a type of feature-flag to allow code to be deployed.
  #    training: "cron(- - - - - -)"
  #    prod: "cron(- - - - - -)"
  #    #    training: "cron(0 20 * * ? *)" # 6am AEST
  #    #    prod: "cron(0 20 * * ? *)" # 6am AEST

  sharedCors:
    origin: ${self:custom.${sls:stage}.corsOrigin, self:custom.default.corsOrigin}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
      - X-Amz-User-Agent
      - X-Amzn-Trace-Id
      - hp-agency-code
      - refresh-token

provider:
  name: aws
  ecr:
    scanOnPush: true
    images:
      hazardpublisherimage:
        path: ./
        file: Dockerfile
        platform: linux/amd64
  region: ap-southeast-2
  timeout: 10
  # Processor architecture: 'x86_64' or 'arm64' via Graviton2 (default: x86_64)
  architecture: x86_64

  enableLegacyDeploymentBucket: true

  # Lambdas that use rds-proxy must live in the same VPC (they don't by default).
  vpc:
    securityGroupIds:
      - ${cf:hp-security-groups-${self:custom.parentStage}.LambdaSecurityGroupId, 'sg-placeholder'}
    subnetIds:
      - ${cf:hp-vpc-${self:custom.parentStage}.PrivateSubnetAZ1, 'subnet-placeholder-1'}
      - ${cf:hp-vpc-${self:custom.parentStage}.PrivateSubnetAZ2, 'subnet-placeholder-2'}
      - ${cf:hp-vpc-${self:custom.parentStage}.PrivateSubnetAZ3, 'subnet-placeholder-3'}

  apiGateway:
    # Compress response when larger than
    minimumCompressionSize: 1024
    metrics: true

  logs:
    restApi:
      accessLogging: true
      format: '{ "requestId": "$context.requestId", "ip": "$context.identity.sourceIp", "user": "$context.identity.user", "time": "$context.requestTime", "method": "$context.httpMethod", "resourcePath": "$context.resourcePath", "protocol": "$context.protocol", "status": $context.status, "responseLength": $context.responseLength, "responseLatency": $context.responseLatency, "basePathMatched": "$context.customDomain.basePathMatched", "integrationErrorMessage": "$context.integrationErrorMessage", "errorMessage": "$context.error.message" }'
      executionLogging: true
      level: ERROR
      fullExecutionData: false

  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "s3:*"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "ses:*"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "sns:Publish"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "lambda:InvokeFunction"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "secretsmanager:GetSecretValue"
            - "secretsmanager:ListSecrets"
            - "secretsmanager:PutSecretValue"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "ssm:GetParameter"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "kms:Decrypt"
            - "kms:Encrypt"
            - "kms:GenerateDataKey"
          Resource: "*"
        - Effect: "Allow"
          Action:
            - "events:PutRule"
            - "events:PutTargets"
            - "events:DeleteRule"
            - "events:RemoveTargets"
          Resource: "*"

        # API Lambdas publish directly to the topic
        - Effect: Allow
          Action: sns:Publish
          Resource:
            - arn:aws:sns:${aws:region, 'ap-southeast-2'}:${aws:accountId, '000000000000'}:${self:custom.parentStage}-hp-publish-warning-topic

        # API Lambdas manage schedules in the stage group
        - Effect: Allow
          Action:
            - scheduler:CreateSchedule
            - scheduler:DeleteSchedule
          Resource:
            - arn:aws:scheduler:${aws:region, 'ap-southeast-2'}:${aws:accountId, '000000000000'}:schedule/${self:custom.parentStage}-hp-schedule-group/*

        # API Lambdas let Scheduler assume the target role
        - Effect: Allow
          Action: iam:PassRole
          Resource: arn:aws:iam::${aws:accountId, '000000000000'}:role/${self:custom.parentStage}-hp-scheduler-to-sns
          Condition:
            StringEquals:
              iam:PassedToService: scheduler.amazonaws.com

        # SQS permissions for onPublish warning queue
        - Effect: "Allow"
          Action:
            - "sqs:ReceiveMessage"
            - "sqs:DeleteMessage"
            - "sqs:GetQueueAttributes"
          Resource:
            - arn:aws:sqs:${aws:region, 'ap-southeast-2'}:${aws:accountId, '000000000000'}:${self:custom.parentStage}-hp-onpublish-warning-queue

  # Environment variables set on the lambda functions.
  environment:
    AWS_ACCOUNT_ID: ${aws:accountId, '000000000000'}
    LOG_LEVEL: ${env:LOG_LEVEL, "info"}
    STAGE: ${sls:stage}
    PARENT_STAGE: ${self:custom.parentStage}
    AUTH_TOKEN_SECRET: ${env:AUTH_TOKEN_SECRET, self:custom.resources.AUTH_TOKEN_SECRET}
    REFRESH_TOKEN_SECRET: ${env:REFRESH_TOKEN_SECRET, self:custom.resources.REFRESH_TOKEN_SECRET}
    BASE_URL: ${env:BASE_URL, ''}
    FROM_EMAIL: ${env:FROM_EMAIL, ''}
    # Non-null defaults required: CloudFormation rejects null in Lambda environment maps.
    AUTH_TOKEN_EXPIRES: ${env:AUTH_TOKEN_EXPIRES, '30 minutes'}
    REFRESH_TOKEN_EXPIRES: ${env:REFRESH_TOKEN_EXPIRES, '1 hour'}
    # 72 hours
    INVITATION_EXPIRES: ${env:INVITATION_EXPIRES, 259200000}
    # 24 hours
    RESET_PASSWORD_LINK_EXPIRES: ${env:RESET_PASSWORD_LINK_EXPIRES, 86400000}
    RENDER_AND_CAPTURE_PDF_LAMBDA: ${env:RENDER_AND_CAPTURE_PDF_LAMBDA, 'hp-render-and-capture-${self:custom.parentStage}-pdf'}
    RENDER_AND_CAPTURE_IMAGE_LAMBDA: ${env:RENDER_AND_CAPTURE_IMAGE_LAMBDA, 'hp-render-and-capture-${self:custom.parentStage}-image'}
    RENDER_AND_CAPTURE_LAMBDA_ENDPOINT_OVERRIDE: ${env:RENDER_AND_CAPTURE_LAMBDA_ENDPOINT_OVERRIDE, ''}
    HAZARD_PUBLISHER_LAMBDA_ENDPOINT_OVERRIDE: ${env:HAZARD_PUBLISHER_LAMBDA_ENDPOINT_OVERRIDE, ''}
    CSV_BUCKET: hazardpublisher-csv-${sls:stage}
    IMAGE_BUCKET: hazardpublisher-image-${sls:stage}
    PDF_BUCKET: hazardpublisher-pdf-${sls:stage}

    # The reporting bucket name is a prefix with the `-{agency-code}` suffix being applied through code.
    REPORTING_BUCKET_PREFIX: ${env:REPORTING_BUCKET_PREFIX, 'hazardpublisher-reporting'}
    HP_SUPPORT_EMAIL: ${env:HP_SUPPORT_EMAIL, ''}

    # New Relic environment variables
    NEW_RELIC_APP_NAME: API-${sls:stage}-HAZARDPUBLISHER
    NEW_RELIC_EXTENSION_LOG_LEVEL: DEBUG
    NEW_RELIC_EXTENSION_LOGS_ENABLED: true
    NEW_RELIC_EXTENSION_SEND_PLATFORM_LOGS: true
    NEW_RELIC_EXTENSION_SEND_FUNCTION_LOGS: true
    NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: true
    NEW_RELIC_ACCOUNT_ID: ${env:NEW_RELIC_ACCOUNT_ID, '${self:custom.hpnewrelicsecrets.NEW_RELIC_ACCOUNT_ID, "0"}'}
    NEW_RELIC_LAMBDA_HANDLER: ${env:NEW_RELIC_LAMBDA_HANDLER, 'index.handler'}
    NEW_RELIC_LICENSE_KEY: ${env:NEW_RELIC_LICENSE_KEY, '${self:custom.hpnewrelicsecrets.NEW_RELIC_INGEST_KEY, "placeholder"}'}
    NEW_RELIC_APM_LAMBDA_MODE: ${env:NEW_RELIC_APM_LAMBDA_MODE, true}

    # Hazard Watch API
    HW_API_KEY: ${env:HW_API_KEY, self:custom.resources.HW_API_KEY}
    HW_API_BASE_URL: ${env:HW_API_BASE_URL, self:custom.resources.HW_API_BASE_URL}
    # Hazard Watch App
    HW_APP_BASE_URL: ${env:HW_APP_BASE_URL, self:custom.resources.HW_APP_BASE_URL}
    # Hazard Publish CAPAU JSON s3 bucket
    HP_CAP_AU_BUCKET: ${env:HP_CAP_AU_BUCKET, self:custom.resources.HP_CAP_AU_BUCKET}
    FONTCONFIG_PATH: ${env:FONTCONFIG_PATH, '/var/task/fonts/'}
    NODE_ENV: ${env:NODE_ENV, ''}
    API_URL: ${env:API_URL, ''}
    HP_LIVE_FEED_GENERATE_TOPIC_ARN: ${env:HP_LIVE_FEED_GENERATE_TOPIC_ARN, '${cf:live-feed-generate-topic-stack-${self:custom.parentStage}.LiveFeedTopicArn, "placeholder"}'}
    # For the ORM package.
    # Core Prisma schema references env("DATABASE_URL_DUMMY"); must be a valid mysql:// URL for engine validation (runtime uses per-agency URLs from PrismaClient options).
    DATABASE_URL_DUMMY: ${env:DATABASE_URL_NSWSES, '${self:custom.resources.BASE_DATABASE_URL, null}/publisher?connection_limit=4'}
    DATABASE_URL_NSWSES: ${env:DATABASE_URL_NSWSES, '${self:custom.resources.BASE_DATABASE_URL, null}/publisher?connection_limit=4'}
    DATABASE_URL_NSWRFS: ${env:DATABASE_URL_NSWRFS, '${self:custom.resources.BASE_DATABASE_URL, null}/nswrfs?connection_limit=4'}
    DATABASE_URL_FRNSW: ${env:DATABASE_URL_FRNSW, '${self:custom.resources.BASE_DATABASE_URL, null}/frnsw?connection_limit=4'}
    DATABASE_URL_DNAESA: ${env:DATABASE_URL_DNAESA, '${self:custom.resources.BASE_DATABASE_URL, null}/dnaesa?connection_limit=4'}
    # Warning publish for non-SES agencies.
    PUBLISH_TOPIC_ARN: arn:aws:sns:${aws:region, 'ap-southeast-2'}:${aws:accountId, '000000000000'}:${self:custom.parentStage}-hp-publish-warning-topic
    HP_SCHEDULE_GROUP_NAME: ${self:custom.parentStage}-hp-schedule-group
    SCHEDULER_TARGET_ROLE_ARN: arn:aws:iam::${aws:accountId, '000000000000'}:role/${self:custom.parentStage}-hp-scheduler-to-sns

# AWS resources that are provisioned during deploy.
resources:
  - extensions:
      IamRoleLambdaExecution:
        DeletionPolicy: ${self:custom.lambdaIamRoleDeletionPolicy}
  - ${file(resources/s3.cfn.yml)}
  - ${file(resources/secrets.cfn.yml)}
  - ${file(resources/permissions.cfn.yml)}

functions:
  #
  # /debug functions
  #

  crash-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/debug/crash.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: debug/crash
          method: get
          cors: ${self:custom.sharedCors}

  #
  # /auth functions
  #

  login-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/auth/login/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    reservedConcurrency: 200
    events:
      - http:
          path: auth/login
          method: post
          cors: ${self:custom.sharedCors}

  refresh-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/auth/refresh/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    reservedConcurrency: 200
    events:
      - http:
          path: auth/refresh
          method: post
          cors: ${self:custom.sharedCors}

  #
  # /users functions
  #

  createUser-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/create/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: users
          method: post
          cors: ${self:custom.sharedCors}

  updateUser-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/update/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: users/{id}
          method: post
          cors: ${self:custom.sharedCors}
          request:
            parameters:
              paths:
                id: true

  activateUser-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/activate/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: users/{id}/activate
          method: post
          cors: ${self:custom.sharedCors}
          request:
            parameters:
              paths:
                id: true

  getUser-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/get/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: users/{id}
          method: get
          cors: ${self:custom.sharedCors}
          request:
            parameters:
              paths:
                id: true

  deleteUser-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/delete/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: users/{id}
          method: delete
          cors: ${self:custom.sharedCors}
          request:
            parameters:
              paths:
                id: true

  listUsers-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/list/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: users
          method: get
          cors: ${self:custom.sharedCors}

  resendInvitation-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/users/invitations/resend/index.handler
      entryPoint:
        - "/lambda-entrypoint.sh"
    events:
      - http:
          path: users/{id}/resend-invitation
          method: post
          cors: ${self:custom.sharedCors}
          request:
            parameters:
              paths:
                id: true

  #
  # /events functions
  #

  udpateEvent-usingImage:
    image:
      name: hazardpublisherimage
      command:
        - src/handler/events/update/index.handler
      entryPoint:
